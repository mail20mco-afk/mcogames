<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCO GAMES - Loja Oficial</title>

  <!-- Google Fonts & Bibliotecas Externas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- PapaParse para ler o Google Sheets CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- html2canvas para gerar imagem do card -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* RESET E ESTILOS GERAIS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0b0d10;
      color: #f0f2f5;
      padding-bottom: 90px;
    }

    a { text-decoration: none; color: inherit; }

    /* CABEÇALHO E NAVEGAÇÃO */
    header {
      background-color: #12161f;
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #1e2430;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #00e676;
      letter-spacing: 1px;
    }

    .logo span { color: #fff; }

    /* BARRA DE BUSCA E FILTROS */
    .filter-container {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-input, .category-select {
      background-color: #161b26;
      border: 1px solid #2a3245;
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }

    .search-input { flex: 1; min-width: 220px; }
    .category-select { min-width: 180px; }

    .search-input:focus, .category-select:focus {
      border-color: #00e676;
    }

    /* CONTAINER PRINCIPAL E SEÇÕES */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .category-section {
      margin-bottom: 3rem;
    }

    .category-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #00e676;
      margin-bottom: 1.2rem;
      border-bottom: 2px solid #1c2333;
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-title small {
      font-size: 0.85rem;
      color: #8a94a6;
      font-weight: 400;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .product-grid .card.hidden-card {
      display: none !important;
    }

    .btn-expand-category {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 1.5rem auto 0 auto;
      padding: 0.75rem 1rem;
      background-color: transparent;
      border: 2px solid #00e676;
      color: #00e676;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }

    .btn-expand-category:hover {
      background-color: #00e676;
      color: #0b0d10;
    }

    /* CARROSSEL DE PRÉ-VENDAS */
    .pre-venda-section {
      background: linear-gradient(180deg, #121824 0%, #0b0d10 100%);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #1e283d;
      margin-bottom: 3rem;
    }

    .carousel-container {
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 1rem;
    }

    .carousel-container::-webkit-scrollbar {
      height: 6px;
    }
    .carousel-container::-webkit-scrollbar-thumb {
      background: #00e676;
      border-radius: 10px;
    }

    .carousel-track {
      display: flex;
      gap: 1.5rem;
    }

    .carousel-track .card {
      min-width: 260px;
      max-width: 260px;
    }

    /* CARD DO JOGO */
    .card {
      background-color: #141923;
      border: 1px solid #1e2536;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #00e676;
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 125%;
      background-color: #0d1017;
    }

    .card-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.75);
      color: #00e676;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .timer-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background-color: #ff9800;
      color: #000;
      font-weight: 800;
      font-size: 0.7rem;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
      line-height: 1.3;
      height: 2.6em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .media-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .btn-media {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      background-color: #1c2333;
      color: #a0aec0;
      border: 1px solid #2d3748;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .btn-media.active {
      background-color: #00e676;
      color: #0b0d10;
      border-color: #00e676;
    }

    .price-box {
      margin-top: auto;
      margin-bottom: 0.75rem;
    }

    .old-price {
      font-size: 0.8rem;
      color: #718096;
      text-decoration: line-through;
    }

    .current-price {
      font-size: 1.3rem;
      font-weight: 800;
      color: #00e676;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-buy {
      flex: 1;
      background-color: #00e676;
      color: #0b0d10;
      border: none;
      padding: 0.6rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .btn-buy:hover { background-color: #00c865; }

    .btn-share {
      background-color: #1c2333;
      color: #fff;
      border: 1px solid #2d3748;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-share:hover { background-color: #2d3748; }

    /* BARRA INFERIOR DE CARRINHO */
    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background-color: #12161f;
      border-top: 1px solid #1e2536;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 99;
    }

    .cart-info { font-weight: 600; }
    .cart-total { color: #00e676; font-weight: 800; font-size: 1.1rem; }

    .btn-checkout {
      background-color: #25d366;
      color: #fff;
      border: none;
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .no-results {
      text-align: center;
      padding: 3rem;
      color: #718096;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo">MCO <span>GAMES</span></div>
  </header>

  <!-- FILTROS E BUSCA -->
  <div class="filter-container">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Pesquisar jogo..." oninput="handleFilter()">
    <select id="categorySelect" class="category-select" onchange="handleFilter()">
      <option value="">Todas as Categorias</option>
    </select>
  </div>

  <!-- CONTAINER DE JOGOS -->
  <main class="main-container" id="catalog-container">
    <p class="no-results">Carregando catálogo...</p>
  </main>

  <!-- BARRA DE COMPRA FIXA -->
  <div class="cart-bar" id="cartBar" style="display: none;">
    <div class="cart-info">
      <span id="cartCount">0</span> item(ns) selecionado(s) | Total: <span class="cart-total" id="cartTotal">R$ 0,00</span>
    </div>
    <button class="btn-checkout" onclick="checkoutWhatsApp()">Finalizar via WhatsApp 📱</button>
  </div>

  <script>
    // CONFIGURAÇÕES E ESTADO GLOBAL
    const CONFIG = {
      sheetCsvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTbnddE66aBmhilS8BtFkch5qx41mzkZOiVtVeMxzHJRXljT3qevVZFGf4jU8o1LNZHuHL_3bnIGqRg/pub?output=csv',
      whatsappNumber: '5599981810222',
      storeUrl: 'https://mcogames.github.io/store/',
      initialLimitPerCategory: 4
    };

    let allGames = [];
    let selectedCart = [];

    // CARREGAMENTO DOS DADOS (GOOGLE SHEETS)
    document.addEventListener('DOMContentLoaded', () => {
      fetchData();
      setInterval(updateTimers, 1000);
    });

    function fetchData() {
      Papa.parse(CONFIG.sheetCsvUrl, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 1) {
            allGames = results.data.slice(1).map(row => parseCsvRow(row)).filter(g => g.name);
            populateCategoryDropdown(allGames);
            renderCatalog(allGames);
          } else {
            document.getElementById('catalog-container').innerHTML = '<p class="no-results">Nenhum jogo encontrado na planilha.</p>';
          }
        },
        error: function(err) {
          console.error("Erro ao carregar CSV:", err);
          document.getElementById('catalog-container').innerHTML = '<p class="no-results">Erro ao carregar catálogo. Verifique o link da planilha.</p>';
        }
      });
    }

    function parseCsvRow(row) {
      const pricePrim = parseFloat(row[5]?.replace(',', '.')) || 0;
      const priceSec = parseFloat(row[7]?.replace(',', '.')) || 0;
      const oldP = parseFloat(row[4]?.replace(',', '.')) || (pricePrim ? pricePrim * 1.3 : 0);

      return {
        id: row[0] || Math.random().toString(),
        name: row[1] || '',
        platform: row[2] || 'PS4/PS5',
        category: row[3] || 'Geral',
        oldPrice: oldP,
        pricePrimary: pricePrim,
        stockPrimary: parseInt(row[6]) || 0,
        priceSecondary: priceSec,
        stockSecondary: parseInt(row[8]) || 0,
        targetDate: row[9] || '',
        img: row[10] || 'https://via.placeholder.com/300x375?text=MCO+GAMES',
        selectedType: pricePrim > 0 ? 'primary' : 'secondary'
      };
    }

    // PREENCHER DROPDOWN DE CATEGORIAS
    function populateCategoryDropdown(gamesList) {
      const select = document.getElementById('categorySelect');
      select.innerHTML = '<option value="">Todas as Categorias</option>';
      
      const categories = [...new Set(gamesList.map(g => g.category))];
      categories.forEach(cat => {
        if (cat) {
          const option = document.createElement('option');
          option.value = cat;
          option.textContent = cat;
          select.appendChild(option);
        }
      });
    }

    // RENDERIZAÇÃO DO CATÁLOGO POR CATEGORIA E CARROSSEL
    function renderCatalog(gamesList) {
      const container = document.getElementById('catalog-container');
      container.innerHTML = '';

      if (!gamesList || gamesList.length === 0) {
        container.innerHTML = '<p class="no-results">Nenhum jogo encontrado.</p>';
        return;
      }

      // 1. Destaque de Pré-Vendas no topo
      const preVendas = gamesList.filter(g => 
        g.category.toLowerCase().includes('pré-venda') || 
        g.category.toLowerCase().includes('pre-venda')
      );

      if (preVendas.length > 0) {
        renderPreVendaSection(preVendas, container);
      }

      // 2. Agrupar demais jogos por Categoria
      const categoriesMap = {};
      gamesList.forEach(game => {
        const cat = game.category || 'Outros';
        if (!categoriesMap[cat]) categoriesMap[cat] = [];
        categoriesMap[cat].push(game);
      });

      // 3. Renderizar cada seção de categoria
      Object.keys(categoriesMap).forEach(catName => {
        const categoryGames = categoriesMap[catName];

        const section = document.createElement('section');
        section.className = 'category-section';

        const title = document.createElement('h2');
        title.className = 'category-title';
        title.innerHTML = `<span>${catName}</span> <small>(${categoryGames.length} jogos)</small>`;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'product-grid';

        categoryGames.forEach((game, index) => {
          const card = createGameCard(game);
          if (index >= CONFIG.initialLimitPerCategory) {
            card.classList.add('hidden-card');
          }
          grid.appendChild(card);
        });

        section.appendChild(grid);

        if (categoryGames.length > CONFIG.initialLimitPerCategory) {
          const expandBtn = document.createElement('button');
          expandBtn.className = 'btn-expand-category';
          expandBtn.innerText = `Ver todas as promoções (${categoryGames.length})`;
          expandBtn.onclick = function() {
            toggleCategoryCards(grid, this, categoryGames.length);
          };
          section.appendChild(expandBtn);
        }

        container.appendChild(section);
      });
    }

    function renderPreVendaSection(games, container) {
      const section = document.createElement('section');
      section.className = 'pre-venda-section';
      section.innerHTML = `
        <h2 class="category-title" style="color: #ffb703; border-bottom-color: #ffb703;">🔥 Pré-Vendas em Destaque</h2>
        <div class="carousel-container">
          <div class="carousel-track" id="preVendaTrack"></div>
        </div>
      `;

      const track = section.querySelector('#preVendaTrack');
      games.forEach(game => {
        const card = createGameCard(game);
        track.appendChild(card);
      });

      container.appendChild(section);
    }

    function toggleCategoryCards(gridElement, buttonElement, totalCount) {
      const hiddenCards = gridElement.querySelectorAll('.card.hidden-card');
      const isExpanded = hiddenCards.length === 0;

      if (isExpanded) {
        const allCards = gridElement.querySelectorAll('.card');
        allCards.forEach((card, index) => {
          if (index >= CONFIG.initialLimitPerCategory) card.classList.add('hidden-card');
        });
        buttonElement.innerText = `Ver todas as promoções (${totalCount})`;
      } else {
        hiddenCards.forEach(card => card.classList.remove('hidden-card'));
        buttonElement.innerText = 'Ver menos';
      }
    }

    // CONSTRUÇÃO DO CARD DE JOGO
    function createGameCard(game) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = game.id;
      card.dataset.targetDate = game.targetDate;

      const currentPrice = game.selectedType === 'primary' ? game.pricePrimary : game.priceSecondary;

      card.innerHTML = `
        <div class="card-img-wrapper">
          <img src="${game.img}" alt="${game.name}" class="card-img" onerror="this.src='https://via.placeholder.com/300x375?text=MCO+GAMES'">
          <span class="card-badge">${game.platform}</span>
          ${game.targetDate ? `<span class="timer-badge" id="timer-${game.id}">--:--:--</span>` : ''}
        </div>
        <div class="card-content">
          <div class="card-title">${game.name}</div>
          
          <div class="media-selector">
            ${game.pricePrimary > 0 ? `
              <button class="btn-media ${game.selectedType === 'primary' ? 'active' : ''}" onclick="selectMedia('${game.id}', 'primary', this)">
                Primária R$ ${game.pricePrimary.toFixed(2)}
              </button>` : ''}
            ${game.priceSecondary > 0 ? `
              <button class="btn-media ${game.selectedType === 'secondary' ? 'active' : ''}" onclick="selectMedia('${game.id}', 'secondary', this)">
                Secundária R$ ${game.priceSecondary.toFixed(2)}
              </button>` : ''}
          </div>

          <div class="price-box">
            <div class="old-price">De: R$ ${game.oldPrice.toFixed(2)}</div>
            <div class="current-price" id="price-display-${game.id}">R$ ${currentPrice.toFixed(2)}</div>
          </div>

          <div class="card-actions">
            <button class="btn-buy" onclick="addToCart('${game.id}')">🛒 Comprar</button>
            <button class="btn-share" title="Compartilhar Card" onclick="shareCardPrint(this.closest('.card'), '${game.name.replace(/'/g, "\\'")}')">📤</button>
          </div>
        </div>
      `;

      return card;
    }

    function selectMedia(gameId, type, btnElement) {
      const game = allGames.find(g => g.id === gameId);
      if (!game) return;

      game.selectedType = type;
      const card = btnElement.closest('.card');
      
      card.querySelectorAll('.btn-media').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const priceDisplay = card.querySelector(`#price-display-${gameId}`);
      const newPrice = type === 'primary' ? game.pricePrimary : game.priceSecondary;
      priceDisplay.textContent = `R$ ${newPrice.toFixed(2)}`;
    }

    // COMPARTILHAMENTO COM LINK DA LOJA
    async function shareCardPrint(cardElement, gameName) {
      const shareText = `🎮 *MCO GAMES* - ${gameName}\n\nEsse e mais jogos acesse: ${CONFIG.storeUrl}`;

      const actionRow = cardElement.querySelector('.card-actions');
      if (actionRow) actionRow.style.visibility = 'hidden';

      try {
        const canvas = await html2canvas(cardElement, {
          useCORS: true,
          scale: 2,
          backgroundColor: '#141923'
        });

        if (actionRow) actionRow.style.visibility = 'visible';

        canvas.toBlob(async (blob) => {
          if (!blob) return;

          const fileName = `${gameName.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.png`;
          const file = new File([blob], fileName, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: gameName,
              text: shareText,
              files: [file]
            });
          } else if (navigator.share) {
            await navigator.share({
              title: gameName,
              text: shareText,
              url: CONFIG.storeUrl
            });
          } else {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL();
            link.click();

            if (navigator.clipboard) {
              await navigator.clipboard.writeText(shareText);
              alert('Imagem baixada e texto promocional copiado para a área de transferência!');
            } else {
              alert(`Imagem baixada!\n\nAcesse: ${CONFIG.storeUrl}`);
            }
          }
        }, 'image/png');

      } catch (err) {
        if (actionRow) actionRow.style.visibility = 'visible';
        console.error('Erro ao gerar compartilhamento:', err);
        alert('Não foi possível gerar a imagem para compartilhamento.');
      }
    }

    // CONTAGEM REGRESSIVA (TIMERS)
    function updateTimers() {
      const now = new Date().getTime();

      allGames.forEach(game => {
        if (!game.targetDate) return;

        const timerEl = document.getElementById(`timer-${game.id}`);
        if (!timerEl) return;

        let target;
        if (game.targetDate.includes('/')) {
          const parts = game.targetDate.split(' ');
          const dateParts = parts[0].split('/');
          const timeParts = parts[1] ? parts[1].split(':') : [0,0,0];
          target = new Date(dateParts[2], dateParts[1] - 1, dateParts[0], timeParts[0], timeParts[1] || 0, timeParts[2] || 0).getTime();
        } else {
          target = new Date(game.targetDate).getTime();
        }

        const diff = target - now;

        if (diff <= 0) {
          timerEl.textContent = 'Lançado / Oferta Encerrou';
          timerEl.style.backgroundColor = '#e53e3e';
          timerEl.style.color = '#fff';
        } else {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          timerEl.textContent = `${days > 0 ? days + 'd ' : ''}${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
      });
    }

    // SISTEMA DE CARRINHO E CHECKOUT
    function addToCart(gameId) {
      const game = allGames.find(g => g.id === gameId);
      if (!game) return;

      const price = game.selectedType === 'primary' ? game.pricePrimary : game.priceSecondary;
      const typeLabel = game.selectedType === 'primary' ? 'Mídia Primária' : 'Mídia Secundária';

      selectedCart.push({
        id: game.id,
        name: game.name,
        platform: game.platform,
        typeLabel: typeLabel,
        price: price
      });

      updateCartBar();
    }

    function updateCartBar() {
      const cartBar = document.getElementById('cartBar');
      const cartCount = document.getElementById('cartCount');
      const cartTotal = document.getElementById('cartTotal');

      if (selectedCart.length === 0) {
        cartBar.style.display = 'none';
        return;
      }

      cartBar.style.display = 'flex';
      cartCount.textContent = selectedCart.length;

      const total = selectedCart.reduce((sum, item) => sum + item.price, 0);
      cartTotal.textContent = `R$ ${total.toFixed(2)}`;
    }

    function checkoutWhatsApp() {
      if (selectedCart.length === 0) return;

      let msg = `🎮 *NOVO PEDIDO - MCO GAMES*\n\n`;
      let total = 0;

      selectedCart.forEach((item, index) => {
        msg += `${index + 1}. *${item.name}* (${item.platform})\n`;
        msg += `   └ Tipo: ${item.typeLabel} - R$ ${item.price.toFixed(2)}\n\n`;
        total += item.price;
      });

      msg += `💰 *TOTAL: R$ ${total.toFixed(2)}*\n\n`;
      msg += `Aguardando orientações para pagamento.`;

      const encoded = encodeURIComponent(msg);
      window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encoded}`, '_blank');
    }

    // FILTRAGEM (PESQUISA + CATEGORIA)
    function handleFilter() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedCat = document.getElementById('categorySelect').value;

      const filtered = allGames.filter(game => {
        const matchesName = game.name.toLowerCase().includes(query);
        const matchesCat = selectedCat === '' || game.category === selectedCat;
        return matchesName && matchesCat;
      });

      renderCatalog(filtered);
    }
  </script>
</body>

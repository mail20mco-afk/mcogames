<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCO Games - Card de Promoção</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 16px 0;
      color: var(--text-main);
    }

    .details {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
    }

    .details li {
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .price-box {
      background-color: rgba(34, 197, 94, 0.1);
      border: 1px border;
      border-color: rgba(34, 197, 94, 0.3);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .price-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
    }

    .price-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .btn-share {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-share:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="card" id="promo-card">
    <span class="badge">🎮 MCO GAMES — Oferta Especial</span>
    <h2 class="title" id="game-title">NOME DO JOGO / PRODUTO</h2>
    
    <ul class="details">
      <li>⚡ Mídia Digital / Mídia Física</li>
      <li>⚡ Envio imediato e suporte completo</li>
      <li>⚡ Garantia total de funcionamento</li>
    </ul>

    <div class="price-box">
      <span class="price-label">Condição Especial</span>
      <span class="price-value" id="game-price">R$ 00,00</span>
      <span class="price-label" style="margin-top: 4px;">Aceitamos Pix e Cartão em até 12x</span>
    </div>

    <button class="btn-share" onclick="compartilharOferta()">
      📲 Compartilhar Oferta
    </button>
  </div>

  <script>
    async function compartilharOferta() {
      const titulo = document.getElementById('game-title').innerText;
      const preco = document.getElementById('game-price').innerText;
      
      const textoCompartilhamento = `🎮 *MCO GAMES — OFERTA ESPECIAL* 🎮\n\n🔥 *${titulo}*\n\n⚡ Destaques:\n• Mídia Digital / Mídia Física\n• Envio imediato\n• Garantia total\n\n💰 *${preco}*\n💳 Pix ou Cartão até 12x\n\n📲 Garanta a sua cópia agora!`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'MCO GAMES',
            text: textoCompartilhamento
          });
        } catch (err) {
          console.log('Compartilhamento cancelado ou não suportado.');
        }
      } else {
        // Fallback: Copia para a área de transferência se o navegador não tiver o Share API
        navigator.clipboard.writeText(textoCompartilhamento);
        alert('Texto da oferta copiado para a área de transferência!');
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCO GAMES - Catálogo</title>
  <!-- Biblioteca para conversão de cards em Imagem (html2canvas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #f0f6fc;
      --accent-green: #00e676;
      --accent-hover: #00c853;
      --timer-bg: #ff9800;
      --timer-text: #000;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    /* Navegação por Abas */
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
    }

    /* Grid de Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Estrutura do Card */
    .game-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* REGRA 1:1 DA CAPA DOS JOGOS */
    .image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1; /* Força Proporção Quadrada 1:1 */
      overflow: hidden;
      background-color: #000;
    }

    .game-cover {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Recorta/ajusta sem distorcer a imagem */
      display: block;
    }

    /* Badge do Relógio de Contagem Regressiva */
    .timer-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background-color: rgba(255, 152, 0, 0.95);
      color: var(--timer-text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 2;
    }

    /* Conteúdo do Card */
    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }

    .game-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
    }

    .price-container {
      margin-top: auto;
    }

    .old-price {
      text-decoration: line-through;
      color: #8b949e;
      font-size: 0.85rem;
    }

    .current-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    /* Botões de Ação */
    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-buy {
      flex: 1;
      background-color: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-share {
      background-color: #21262d;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Layout da Imagem Gerada para Compartilhamento */
    .share-canvas-target {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Abas de Navegação -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="filterCategory('TODOS')">Todos</button>
    <button class="tab-btn" onclick="filterCategory('PROMO')">Promoções</button>
    <button class="tab-btn" onclick="filterCategory('PRE VENDA')">Pré-Venda</button>
  </div>

  <!-- Container onde os Cards serão renderizados -->
  <div id="cards-grid" class="cards-grid"></div>

  <script>
    // Exemplo de dados vindos da Planilha (Simulação da Row da sua Planilha)
    // Row Index: 0: ID, 1: Nome, 2: Imagem, 3: Categoria, 4: Preço De, 5: Preço Por, 6: Link, 9: TargetDate
    const sheetData = [
      [
        "1", 
        "EA SPORTS FC™ 27 Edição Padrão", 
        "https://via.placeholder.com/600x600/1e293b/ffffff?text=FC+27+Cover", 
        "PRE VENDA", 
        "R$ 349,00", 
        "R$ 237,90", 
        "https://mcogames.github.io/store/",
        "", "",
        "2026-10-15T23:59:59" // Data da Pré-Venda
      ],
      [
        "2", 
        "Mortal Kombat 2", 
        "https://via.placeholder.com/600x600/1e293b/ffffff?text=MK+2+Cover", 
        "PROMO", 
        "R$ 299,00", 
        "R$ 149,90", 
        "https://mcogames.github.io/store/",
        "", "",
        "25/09/2026 23:59:59" // Data em formato BR
      ]
    ];

    let currentCategory = 'TODOS';

    // 1. CONVERTER E VALIDAR DATA FLEXÍVEL (Suporta DD/MM/AAAA, AAAA-MM-DD e ISO)
    function parseTargetDate(dateStr) {
      if (!dateStr || String(dateStr).trim() === '') return null;
      dateStr = String(dateStr).trim();

      // Caso 1: Formato DD/MM/AAAA ou DD/MM/AAAA HH:MM:SS
      if (dateStr.includes('/')) {
        const parts = dateStr.split(' ');
        const dateParts = parts[0].split('/');
        const day = parseInt(dateParts[0], 10);
        const month = parseInt(dateParts[1], 10) - 1;
        const year = parseInt(dateParts[2], 10);

        let hours = 23, minutes = 59, seconds = 59;
        if (parts[1]) {
          const timeParts = parts[1].split(':');
          hours = parseInt(timeParts[0], 10) || 0;
          minutes = parseInt(timeParts[1], 10) || 0;
          seconds = parseInt(timeParts[2], 10) || 0;
        }
        return new Date(year, month, day, hours, minutes, seconds);
      }

      // Caso 2: Formato ISO ou YYYY-MM-DD
      const parsedDate = new Date(dateStr);
      return isNaN(parsedDate.getTime()) ? null : parsedDate;
    }

    // 2. ATUALIZADOR DOS RELÓGIOS DE CONTAGEM REGRESSIVA
    function updateTimers() {
      const now = new Date().getTime();
      const timerElements = document.querySelectorAll('.timer-badge');

      timerElements.forEach(el => {
        const targetStr = el.getAttribute('data-target');
        const targetDate = parseTargetDate(targetStr);

        if (!targetDate) {
          el.style.display = 'none';
          return;
        }

        const distance = targetDate.getTime() - now;

        if (distance < 0) {
          el.innerHTML = "⏳ Expirado";
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        let formattedTime = "⏳ ";
        if (days > 0) formattedTime += `${days}d `;
        formattedTime += `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;

        el.innerHTML = formattedTime;
      });
    }

    // 3. RENDERIZAÇÃO DOS CARDS
    function renderCards() {
      const container = document.getElementById('cards-grid');
      container.innerHTML = '';

      const filteredData = sheetData.filter(row => {
        if (currentCategory === 'TODOS') return true;
        return row[3] === currentCategory;
      });

      filteredData.forEach((row, index) => {
        const title = row[1];
        const imageUrl = row[2];
        const oldPrice = row[4];
        const price = row[5];
        const buyUrl = row[6];
        const targetDateStr = row[9];

        const card = document.createElement('div');
        card.className = 'game-card';
        card.id = `card-${index}`;

        // Estrutura do card com a imagem 1:1 e badge de temporizador
        card.innerHTML = `
          <div class="image-wrapper">
            <img src="${imageUrl}" class="game-cover" alt="${title}" loading="lazy" />
            ${targetDateStr ? `<div class="timer-badge" data-target="${targetDateStr}">Carregando...</div>` : ''}
          </div>
          <div class="card-content">
            <div class="game-title">${title}</div>
            <div class="price-container">
              ${oldPrice ? `<div class="old-price">De: ${oldPrice}</div>` : ''}
              <div class="current-price">A partir de ${price}</div>
            </div>
            <div class="action-buttons">
              <a href="${buyUrl}" target="_blank" class="btn-buy">Comprar</a>
              <button class="btn-share" onclick="shareSingleMessage('${index}', '${title}', '${buyUrl}')" title="Compartilhar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      // Sincroniza e força a atualização dos relógios imediatamente após renderizar
      updateTimers();
    }

    // 4. FILTRAR POR CATEGORIA (ABAS)
    function filterCategory(category) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toUpperCase().includes(category));
      });
      renderCards();
    }

    // 5. COMPARTILHAMENTO UNIFICADO (IMAGEM + LEGENDA NA MESMA MENSAGEM)
    async function shareSingleMessage(cardIndex, title, storeUrl) {
      const cardElement = document.getElementById(`card-${cardIndex}`);
      
      // Esconde temporariamente os botões de ação antes de capturar a imagem
      const actionButtons = cardElement.querySelector('.action-buttons');
      actionButtons.style.display = 'none';

      try {
        // Converte o card visual completo em imagem (HTML2Canvas)
        const canvas = await html2canvas(cardElement, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#161b22'
        });

        // Restaura os botões de ação na interface
        actionButtons.style.display = 'flex';

        // Transforma o Canvas em um Arquivo Blob de Imagem
        canvas.toBlob(async (blob) => {
          const file = new File([blob], `MCO_GAMES_${title.replace(/\s+/g, '_')}.png`, { type: 'image/png' });

          // Texto formatado para ser a LEGENDA da imagem
          const shareCaption = `🎮 *MCO GAMES* - ${title}\n\nEsse e mais jogos acesse:\n${storeUrl}`;

          // Verifica suporte à API Web Share (Celulares/Navegadores modernos)
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              text: shareCaption // Envia a legenda ATRELADA à imagem em 1 única mensagem
            });
          } else {
            // Fallback: Download da imagem caso o navegador no PC não suporte compartilhamento direto
            const link = document.createElement('a');
            link.download = `MCO_GAMES_${title}.png`;
            link.href = canvas.toDataURL();
            link.click();
            alert('Imagem baixada! Copie o link da loja e envie junto com a imagem.');
          }
        }, 'image/png');

      } catch (err) {
        console.error('Erro ao gerar imagem para compartilhamento:', err);
        actionButtons.style.display = 'flex';
      }
    }

    // Loop continuo para atualizar os relógios a cada 1 segundo
    setInterval(updateTimers, 1000);

    // Inicialização da página
    document.addEventListener('DOMContentLoaded', renderCards);
  </script>
</body>
</html>

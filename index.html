<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCO GAMES - Catálogo Oficial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px 0 30px;
    }

    header h1 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .card-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background-color: #0f172a;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .card-price {
      font-size: 1.1rem;
      color: #4ade80;
      font-weight: bold;
      margin-top: auto;
      margin-bottom: 12px;
    }

    .btn-zap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #22c55e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    .btn-zap:hover {
      background-color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>MCO GAMES</h1>
      <p>Confira nossos jogos em destaque e faça seu pedido pelo WhatsApp</p>
    </header>

    <div id="catalogo" class="grid">
      <!-- Os cards dos jogos serão gerados aqui -->
    </div>
  </div>

  <script>
    // Configuração dos jogos (Pode adicionar ou alterar os itens abaixo)
    const jogos = [
      {
        titulo: "Resident Evil 4 Remake",
        preco: "A partir de R$ 120,00",
        imagem: "https://m.media-amazon.com/images/I/811SuvY4zBL._AC_SX342_.jpg",
        whatsapp: "https://wa.me/5599999999999?text=Olá,%20tenho%20interesse%20no%20Resident%20Evil%204"
      },
      {
        titulo: "GTA V",
        preco: "A partir de R$ 80,00",
        imagem: "https://m.media-amazon.com/images/I/81qA6R9Mh-L._AC_SX342_.jpg",
        whatsapp: "https://wa.me/5599999999999?text=Olá,%20tenho%20interesse%20no%20GTA%20V"
      }
    ];

    const container = document.getElementById('catalogo');

    function carregarCatalogo() {
      container.innerHTML = '';
      
      jogos.forEach(jogo => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <img src="${jogo.imagem}" alt="${jogo.titulo}" class="card-img" onerror="this.src='https://via.placeholder.com/300x400?text=Sem+Imagem'">
          <div class="card-body">
            <h2 class="card-title">${jogo.titulo}</h2>
            <div class="card-price">${jogo.preco}</div>
            <a href="${jogo.whatsapp}" target="_blank" class="btn-zap">
              Compartilhar no Zap
            </a>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Executa a montagem do catálogo assim que a página carrega
    document.addEventListener('DOMContentLoaded', carregarCatalogo);
  </script>
</body>
</html>

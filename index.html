<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCO GAMES - Catálogo</title>
  <!-- html2canvas para conversão do card em Imagem -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #f0f6fc;
      --accent-green: #00e676;
      --accent-hover: #00c853;
      --timer-bg: #ff9800;
      --timer-text: #000;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    /* Abas de Navegação */
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
    }

    /* Grid de Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* Card do Jogo */
    .game-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* PROPORÇÃO 1:1 QUADRADA DA CAPA DOS JOGOS */
    .image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: #000;
    }

    .image-wrapper img,
    .game-cover {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    /* Temporizador / Relógio na Capa */
    .timer-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background-color: rgba(255, 152, 0, 0.95);
      color: var(--timer-text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 2;
    }

    /* Conteúdo do Card */
    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }

    .game-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
    }

    .price-container {
      margin-top: auto;
    }

    .old-price {
      text-decoration: line-through;
      color: #8b949e;
      font-size: 0.85rem;
    }

    .current-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    /* Botões */
    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-buy {
      flex: 1;
      background-color: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn-buy:hover {
      background-color: var(--accent-hover);
    }

    .btn-share {
      background-color: #21262d;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-share:hover {
      background-color: #30363d;
    }
  </style>
</head>
<body>

  <!-- Navegação por Abas -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="filterCategory('TODOS')">Todos</button>
    <button class="tab-btn" onclick="filterCategory('PROMO')">Promoções</button>
    <button class="tab-btn" onclick="filterCategory('PRE VENDA')">Pré-Venda</button>
  </div>

  <!-- Container dos Cards -->
  <div id="cards-grid" class="cards-grid"></div>

  <script>
    // =========================================================================
    // INSIRA AQUI A URL DE EXPORTAÇÃO CSV DA SUA PLANILHA DO GOOGLE SHEETS
    // Exemplo: https://docs.google.com/spreadsheets/d/SEU_ID/gviz/tq?tqx=out:csv
    // =========================================================================
    const GOOGLE_SHEETS_CSV_URL = 'SUA_URL_DO_GOOGLE_SHEETS_AQUI';

    let allGamesData = [];
    let currentCategory = 'TODOS';

    // 1. CONVERTER E VALIDAR DATA FLEXÍVEL (DD/MM/AAAA, YYYY-MM-DD, ISO)
    function parseTargetDate(dateStr) {
      if (!dateStr || String(dateStr).trim() === '') return null;
      dateStr = String(dateStr).trim();

      // Formato DD/MM/AAAA ou DD/MM/AAAA HH:MM:SS
      if (dateStr.includes('/')) {
        const parts = dateStr.split(' ');
        const dateParts = parts[0].split('/');
        const day = parseInt(dateParts[0], 10);
        const month = parseInt(dateParts[1], 10) - 1;
        const year = parseInt(dateParts[2], 10);

        let hours = 23, minutes = 59, seconds = 59;
        if (parts[1]) {
          const timeParts = parts[1].split(':');
          hours = parseInt(timeParts[0], 10) || 0;
          minutes = parseInt(timeParts[1], 10) || 0;
          seconds = parseInt(timeParts[2], 10) || 0;
        }
        return new Date(year, month, day, hours, minutes, seconds);
      }

      // Formato ISO ou YYYY-MM-DD
      const parsedDate = new Date(dateStr);
      return isNaN(parsedDate.getTime()) ? null : parsedDate;
    }

    // 2. ATUALIZADOR DOS RELÓGIOS DE CONTAGEM REGRESSIVA
    function updateTimers() {
      const now = new Date().getTime();
      const timerElements = document.querySelectorAll('.timer-badge');

      timerElements.forEach(el => {
        const targetStr = el.getAttribute('data-target');
        const targetDate = parseTargetDate(targetStr);

        if (!targetDate) {
          el.style.display = 'none';
          return;
        }

        const distance = targetDate.getTime() - now;

        if (distance < 0) {
          el.innerHTML = "⏳ Expirado";
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        let formattedTime = "⏳ ";
        if (days > 0) formattedTime += `${days}d `;
        formattedTime += `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;

        el.innerHTML = formattedTime;
      });
    }

    // 3. RENDERIZAÇÃO DOS CARDS DENTRO DA PÁGINA
    function renderCards() {
      const container = document.getElementById('cards-grid');
      container.innerHTML = '';

      const filteredData = allGamesData.filter(row => {
        if (currentCategory === 'TODOS') return true;
        const categoria = (row[3] || '').toUpperCase().trim();
        return categoria === currentCategory;
      });

      if (filteredData.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8b949e;">Nenhum jogo encontrado nesta categoria.</p>';
        return;
      }

      filteredData.forEach((row, index) => {
        const title = row[1] || 'Jogo sem título';
        const imageUrl = row[2] || '';
        const category = row[3] || '';
        const oldPrice = row[4] || '';
        const price = row[5] || '';
        const buyUrl = row[6] || '#';
        const targetDateStr = row[9] || '';

        const card = document.createElement('div');
        card.className = 'game-card';
        card.id = `card-${index}`;

        card.innerHTML = `
          <div class="image-wrapper">
            <img src="${imageUrl}" class="game-cover" alt="${title}" loading="lazy" crossorigin="anonymous" />
            ${targetDateStr ? `<div class="timer-badge" data-target="${targetDateStr}">Carregando...</div>` : ''}
          </div>
          <div class="card-content">
            <div class="game-title">${title}</div>
            <div class="price-container">
              ${oldPrice ? `<div class="old-price">De: ${oldPrice}</div>` : ''}
              <div class="current-price">A partir de ${price}</div>
            </div>
            <div class="action-buttons">
              <a href="${buyUrl}" target="_blank" class="btn-buy">Comprar</a>
              <button class="btn-share" onclick="shareSingleMessage(this, '${title.replace(/'/g, "\\'")}', '${buyUrl}')" title="Compartilhar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      // Atualiza os relógios imediatamente após a renderização
      updateTimers();
    }

    // 4. TROCA DE ABAS / FILTRO
    function filterCategory(category) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toUpperCase().includes(category));
      });
      renderCards();
    }

    // 5. CARREGAMENTO DINÂMICO DOS DADOS DA PLANILHA (CSV)
    async function loadSheetData() {
      try {
        const response = await fetch(GOOGLE_SHEETS_CSV_URL);
        const csvText = await response.text();

        // Parser simples de CSV tratando aspas e vírgulas
        const rows = csvText.split('\n').map(row => {
          return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"\vert{}"$/g, '').trim());
        });

        // Remove o cabeçalho
        allGamesData = rows.slice(1);
        renderCards();
      } catch (err) {
        console.error("Erro ao carregar dados da planilha:", err);
      }
    }

    // 6. COMPARTILHAMENTO UNIFICADO (IMAGEM + LEGENDA NA MESMA MENSAGEM)
    async function shareSingleMessage(buttonEl, title, storeUrl) {
      const cardElement = buttonEl.closest('.game-card');
      const actionButtons = cardElement.querySelector('.action-buttons');
      
      if (actionButtons) actionButtons.style.display = 'none';

      try {
        const canvas = await html2canvas(cardElement, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#161b22'
        });

        if (actionButtons) actionButtons.style.display = 'flex';

        canvas.toBlob(async (blob) => {
          const file = new File([blob], `MCO_GAMES_${title.replace(/\s+/g, '_')}.png`, { type: 'image/png' });
          
          // Legenda integrada diretamente ao arquivo para enviar numa mensagem única
          const shareCaption = `🎮 *MCO GAMES* - ${title}\n\nEsse e mais jogos acesse:\n${storeUrl}`;

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              text: shareCaption
            });
          } else {
            const link = document.createElement('a');
            link.download = `MCO_GAMES_${title}.png`;
            link.href = canvas.toDataURL();
            link.click();
          }
        }, 'image/png');

      } catch (err) {
        console.error('Erro ao compartilhar:', err);
        if (actionButtons) actionButtons.style.display = 'flex';
      }
    }

    // Atualização contínua do relógio
    setInterval(updateTimers, 1000);

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', loadSheetData);
  </script>
</body>
</html>

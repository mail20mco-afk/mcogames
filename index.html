<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCO Games - Loja Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f141d;
      color: #ffffff;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .store-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .store-header {
      margin-bottom: 32px;
      border-bottom: 2px solid #1f2738;
      padding-bottom: 16px;
    }

    .store-title {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* Grelha do Catálogo de Jogos */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    /* Card do Produto */
    .product-card {
      background-color: #161c28;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid #222b3d;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #2e3c54;
    }

    .card-banner {
      position: relative;
      width: 100%;
      height: 280px;
      background-color: #1a2232;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Badges */
    .badge-platform {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 2;
    }

    .badge-discount {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: #ff0055;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 2;
    }

    /* Informações do Jogo */
    .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .price-original {
      font-size: 13px;
      color: #7a8b9e;
      text-decoration: line-through;
      margin-bottom: 2px;
    }

    .price-from {
      font-size: 18px;
      font-weight: 800;
      color: #00e676;
      margin-bottom: 16px;
    }

    /* Variações de Licença */
    .variations-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }

    .variation-item {
      background-color: #1f2738;
      border: 1px solid #2a354b;
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }

    .variation-title {
      font-size: 11px;
      color: #a0aec0;
      display: block;
      margin-bottom: 2px;
    }

    .variation-price {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .out-of-stock {
      opacity: 0.35;
    }
  </style>
</head>
<body>

  <main class="store-container">
    <header class="store-header">
      <h1 class="store-title">MCO GAMES</h1>
    </header>

    <!-- Catálogo de Jogos -->
    <div class="products-grid" id="store-catalog"></div>
  </main>

  <script>
    // Catálogo de Jogos (Lista de produtos)
    const produtosData = [
      {
        id: "nba2k27",
        titulo: "NBA 2K27",
        plataforma: "PS5",
        precoDeTabela: 349.00,
        imagemUrl: "https://images.unsplash.com/photo-1546519638-68e109498ffc?w=500&q=80",
        variacoes: [
          { id: "primaria", nome: "Primária", estoque: 1, preco: 257.90 },
          { id: "secundaria", nome: "Secundária", estoque: 1, preco: 187.90 }
        ]
      },
      {
        id: "gta6",
        titulo: "GTA VI",
        plataforma: "PS5",
        precoDeTabela: 499.00,
        imagemUrl: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500&q=80",
        variacoes: [
          { id: "primaria", nome: "Primária", estoque: 1, preco: 399.90 },
          { id: "secundaria", nome: "Secundária", estoque: 1, preco: 299.90 }
        ]
      },
      {
        id: "eafc27",
        titulo: "EA Sports FC 27",
        plataforma: "PS5",
        precoDeTabela: 350.00,
        imagemUrl: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=500&q=80",
        variacoes: [
          { id: "primaria", nome: "Primária", estoque: 1, preco: 260.00 },
          { id: "secundaria", nome: "Secundária", estoque: 0, preco: 190.00 }
        ]
      }
    ];

    // Formatação de moeda BRL
    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Função de geração do HTML do Card
    function criarCardHtml(produto) {
      // Filtrar apenas variações com estoque > 0
      const disponiveis = produto.variacoes.filter(item => item.estoque > 0);
      
      let precoDeExibicao = "Esgotado";
      let percentualDesconto = 0;
      let temEstoque = disponiveis.length > 0;

      if (temEstoque) {
        // Cálculo do Menor Preço e Porcentagem de Desconto Real
        const menorPreco = Math.min(...disponiveis.map(item => item.preco));
        precoDeExibicao = `A partir de ${formatarMoeda(menorPreco)}`;
        percentualDesconto = Math.round(((produto.precoDeTabela - menorPreco) / produto.precoDeTabela) * 100);
      }

      // Renderização do bloco das opções de licença
      const variacoesHtml = produto.variacoes.map(v => `
        <div class="variation-item ${v.estoque <= 0 ? 'out-of-stock' : ''}">
          <span class="variation-title">${v.nome} (${v.estoque} unid.)</span>
          <span class="variation-price">${formatarMoeda(v.preco)}</span>
        </div>
      `).join('');

      return `
        <div class="product-card">
          <div class="card-banner">
            <span class="badge-platform">${produto.plataforma}</span>
            ${temEstoque ? `<span class="badge-discount">-${percentualDesconto}%</span>` : ''}
            <img src="${produto.imagemUrl}" alt="${produto.titulo}">
          </div>
          
          <div class="card-info">
            <h3 class="product-title">${produto.titulo}</h3>
            <div class="price-original">${formatarMoeda(produto.precoDeTabela)}</div>
            <div class="price-from">${precoDeExibicao}</div>
            <div class="variations-grid">
              ${variacoesHtml}
            </div>
          </div>
        </div>
      `;
    }

    // Renderizar o catálogo na página
    document.addEventListener('DOMContentLoaded', () => {
      const catalogContainer = document.getElementById('store-catalog');
      if (catalogContainer) {
        catalogContainer.innerHTML = produtosData.map(p => criarCardHtml(p)).join('');
      }
    });
  </script>
</body>
</html>

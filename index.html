<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card de Produto - MCO Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f141d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Estilização do Card */
    .product-card {
      width: 280px;
      background-color: #161c28;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #222b3d;
      color: #ffffff;
    }

    .card-banner {
      position: relative;
      width: 100%;
      height: 260px;
      background-color: #0d1117;
    }

    .card-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Badges da imagem */
    .badge-platform {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .badge-discount {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: #ff0055;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* Corpo do Card */
    .card-info {
      padding: 16px;
    }

    .product-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .price-original {
      font-size: 13px;
      color: #7a8b9e;
      text-decoration: line-through;
      margin-bottom: 2px;
    }

    .price-from {
      font-size: 18px;
      font-weight: 800;
      color: #00e676; /* Verde em destaque */
      margin-bottom: 16px;
    }

    /* Grade de Variações */
    .variations-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .variation-item {
      background-color: #1f2738;
      border: 1px solid #2a354b;
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .variation-item:hover {
      border-color: #00e676;
      background-color: #253046;
    }

    .variation-title {
      font-size: 11px;
      color: #a0aec0;
      display: block;
      margin-bottom: 2px;
    }

    .variation-price {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .out-of-stock {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Estrutura do Card -->
  <div class="product-card" id="card-nba2k27">
    <div class="card-banner">
      <span class="badge-platform" id="platform-badge">PS5</span>
      <span class="badge-discount" id="discount-badge">-0%</span>
      <img src="https://via.placeholder.com/280x260/111/fff?text=NBA+2K27" alt="Capa do Jogo" id="cover-img">
    </div>
    
    <div class="card-info">
      <h3 class="product-title" id="product-title">NBA 2K27</h3>
      
      <div class="price-original" id="price-original">R$ 0,00</div>
      <div class="price-from" id="price-from">A partir de R$ 0,00</div>

      <div class="variations-grid" id="variations-container">
        <!-- Variações renderizadas dinamicamente pelo JS -->
      </div>
    </div>
  </div>

  <script>
    // 1. Dados do produto (simulando retorno de banco de dados ou API)
    const produtoData = {
      titulo: "NBA 2K27",
      plataforma: "PS5",
      precoDeTabela: 349.00,
      imagemUrl: "https://via.placeholder.com/280x260/0d1117/00e676?text=NBA+2K27",
      variacoes: [
        { id: "primaria", nome: "Primária", estoque: 1, preco: 257.90 },
        { id: "secundaria", nome: "Secundária", estoque: 1, preco: 187.90 }
      ]
    };

    // Função de formatação para Moeda Brasileira (R$)
    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // 2. Função principal para renderizar o Card Corretamente
    function renderizarCardProduto(produto) {
      // Filtrar apenas variações em estoque
      const disponiveis = produto.variacoes.filter(item => item.estoque > 0);

      if (disponiveis.length === 0) {
        document.getElementById('price-from').innerText = "Esgotado";
        document.getElementById('discount-badge').style.display = 'none';
        return;
      }

      // LÓGICA CHAVE: Pegar o menor valor entre as opções disponíveis
      const menorPreco = Math.min(...disponiveis.map(item => item.preco));

      // LÓGICA CHAVE: Recalcular a porcentagem de desconto baseada no menor preço
      const percentualDesconto = Math.round(((produto.precoDeTabela - menorPreco) / produto.precoDeTabela) * 100);

      // Atualizar Textos do Card
      document.getElementById('product-title').innerText = produto.titulo;
      document.getElementById('platform-badge').innerText = produto.plataforma;
      document.getElementById('price-original').innerText = formatarMoeda(produto.precoDeTabela);
      
      // Atualizar o "A partir de" com o menor valor calculado
      document.getElementById('price-from').innerText = `A partir de ${formatarMoeda(menorPreco)}`;
      
      // Atualizar o badge de desconto
      document.getElementById('discount-badge').innerText = `-${percentualDesconto}%`;

      // Renderizar as caixas de variações
      const containerVariacoes = document.getElementById('variations-container');
      containerVariacoes.innerHTML = ''; // Limpar antes de renderizar

      produto.variacoes.forEach(v => {
        const itemDiv = document.createElement('div');
        itemDiv.className = `variation-item ${v.estoque <= 0 ? 'out-of-stock' : ''}`;
        
        itemDiv.innerHTML = `
          <span class="variation-title">${v.nome} (${v.estoque} unid.)</span>
          <span class="variation-price">${formatarMoeda(v.preco)}</span>
        `;
        
        containerVariacoes.appendChild(itemDiv);
      });
    }

    // Executa a função passando os dados do produto
    renderizarCardProduto(produtoData);
  </script>
</body>
</html>
